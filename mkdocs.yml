site_name: pyclickplc
site_description: Documentation for pyclickplc
repo_url: https://github.com/ssweber/pyclickplc
site_url: https://ssweber.github.io/pyclickplc/

theme:
  name: material

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Client: guides/client.md
      - Types & Values: guides/types.md
      - Addressing: guides/addressing.md
      - Modbus Service: guides/modbus_service.md
      - Server & Simulator: guides/server.md
      - File I/O: guides/files.md
      - Examples: guides/examples.md
  - API Reference:
      - Overview: reference/index.md
      - Client API: reference/api/client.md
      - Service API: reference/api/service.md
      - Server API: reference/api/server.md
      - Files API: reference/api/files.md
      - Addressing API: reference/api/addressing.md
      - Validation API: reference/api/validation.md
      - Advanced API: reference/api/advanced.md

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_reference.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            filters:
              - "!^_"
            heading_level: 2
            inherited_members: false
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Getting Started:
          - getting-started/*.md
        Guides:
          - guides/*.md
        API Reference:
          - reference/index.md
          - reference/api/*.md
