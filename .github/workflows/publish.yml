name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Enable manual trigger.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.8"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      # A pull request into main must pass CI before it merges, so publish only a commit on
      # main and do not run the tests again.
      - name: Check that the commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on main. Publish only a commit on main."
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Check the built wheel
        env:
          # Empty on a manual run, which has no release tag.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          wheel=$(ls dist/*.whl)
          check='import importlib.metadata, pyclickplc; print(importlib.metadata.version("pyclickplc"))'
          version=$(uv run --isolated --no-project --with "$wheel" python -c "$check")
          echo "The wheel imports as pyclickplc $version."
          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then
            echo "::error::The wheel is pyclickplc $version, but the release tag is $TAG."
            exit 1
          fi

      - name: Publish to PyPI (using uv)
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    name: Deploy the release's docs
    # A pre-release leaves the public docs on the latest full release.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy docs from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run docs.yml --ref main -f ref="$TAG"
